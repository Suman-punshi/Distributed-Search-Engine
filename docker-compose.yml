version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    depends_on:
      - extractor
      - searcher

  extractor:
    build: ./extractor
    ports:
      - "5001:5001"

  searcher:
    build: ./searcher
    environment:
      PINECONE_API_KEY: "${PINECONE_API_KEY:?Set PINECONE_API_KEY to a new Pinecone API key}"
    ports:
      - "5002:5002"
